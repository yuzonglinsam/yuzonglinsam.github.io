function renderActivity(){const list=(db.activity||[]).filter(e=>e.project===db.active).slice().reverse();return `<div class="grid-2"><section class="panel"><div class="panel-head"><h2>Change history</h2><span class="chip purple">${list.length} recorded changes</span></div><p class="section-note">Records edits on this device. Updates by different people are not individually authenticated in this local prototype.</p>${list.length?list.map(e=>`<div class="line-item"><span class="chip ${e.kind==='task'?'purple':e.kind==='milestone'?'green':'gray'}">${esc(e.kind)}</span><div style="flex:1"><strong>${esc(e.message)}</strong><small>${new Date(e.time).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join(''):'<div class="empty">No changes recorded yet. Move a task or edit a milestone to start an activity trail.</div>'}</section><section class="panel"><div class="panel-head"><h2>Accountability model</h2></div><p class="textmuted">Every task has an owner, due date, status and optional prerequisite. Recent edits are visible here so project leads can explain how delivery evolved.</p><div class="line-item"><strong>Task ownership</strong><span class="chip purple">${tasks().filter(t=>!!t.owner).length}/${tasks().length}</span></div><div class="line-item"><strong>Blocked tasks</strong><span class="chip amber">${tasks().filter(t=>t.status!=='Done'&&blockedBy(t)).length}</span></div><div class="line-item"><strong>Pending review</strong><span class="chip gray">${tasks().filter(t=>t.status==='In review').length}</span></div><button class="btn" onclick="exportReport()" style="margin-top:20px">Export project status report</button></section></div>`}
function exportReport(){const p=project(),tt=tasks(),late=tt.filter(isLate),blocked=tt.filter(t=>blockedBy(t)&&t.status!=='Done');const cell=v=>esc(v||'—');let page=`<!doctype html><html lang="en"><meta charset="utf-8"><title>${cell(p.name)} — GroupPilot status report</title><style>body{font:14px/1.65 system-ui,sans-serif;color:#17213b;margin:45px;max-width:1000px}h1{font-size:27px}h2{font-size:18px;margin-top:25px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e2e7ef;text-align:left;padding:9px}th{background:#f4f5fb}small{color:#6b7280}aside{background:#f3f1ff;padding:14px;border-radius:9px}@media print{body{margin:25px}}</style><h1>${cell(p.name)}</h1><p>${cell(p.course)} · ${cell(p.type)} · Due ${cell(p.deadline)}</p><p>${cell(p.description)}</p><aside><b>Delivery status:</b> ${progress(tt)}% complete · ${tt.filter(t=>t.status==='Done').length}/${tt.length} tasks done · ${late.length} overdue · ${blocked.length} blocked</aside><h2>Task responsibilities</h2><table><thead><tr><th>Task</th><th>Owner</th><th>Status</th><th>Due</th><th>Depends on</th></tr></thead><tbody>${tt.map(t=>`<tr><td>${cell(t.title)}</td><td>${cell(p.members.find(m=>m.id===t.owner)?.name)}</td><td>${cell(t.status)}</td><td>${cell(t.due)}</td><td>${cell(tt.find(x=>x.id===t.dependsOn)?.title)}</td></tr>`).join('')}</tbody></table><h2>Milestones</h2><table>${p.milestones.map(m=>`<tr><td>${cell(m.name)}</td><td>${cell(m.date)}</td><td>${m.done?'Complete':'Open'}</td></tr>`).join('')}</table><small>Generated locally in GroupPilot. Snapshot date: ${new Date().toLocaleString()}.</small></html>`;let a=document.createElement('a'),blob=new Blob([page],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob);a.href=url;a.download='GroupPilot-report-'+today()+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);recordEvent('report','Exported a project status report');save();toast('Printable status report downloaded')}
function renderSidebar(){let nav=[['dashboard','◫','Overview'],['board','▦','Task board'],['timeline','◷','Milestones'],['team','♙','Team & workload'],['insights','◈','Insights'],['activity','≡','Activity log']];$('mainNav').innerHTML=nav.map(([id,icon,label])=>`<button class="nav ${db.view===id?'active':''}" onclick="setView('${id}')"><span class="mark">${icon}</span>${label}</button>`).join('');$('projectChoices').innerHTML=db.projects.map((p,i)=>`<button class="project-choice ${db.active===p.id?'active':''}" onclick="switchProject('${esc(p.id)}')"><span class="project-dot" style="background:${colors[i%colors.length]}"></span><span>${esc(p.name)}</span></button>`).join('');$('mobileSelect').innerHTML=db.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===db.active?'selected':''}>${esc(p.name)}</option>`).join('');$('breadcrumbProject').textContent=project()?.name||'';}
function setView(v){db.view=v;save();render()}function switchProject(id){if(!db.projects.some(p=>p.id===id))return;db.active=id;save();render()}function render(){renderSidebar();let p=project();if(!p){$('screen').innerHTML='Create a project to begin.';return}const titles={dashboard:'Project overview',board:'Task board',timeline:'Milestones & timeline',team:'Team & workload',insights:'Project insights',activity:'Activity & accountability'};let head=`<div class="eyebrow">${db.view==='dashboard'?'YOUR COMMAND CENTER':'PROJECT WORKSPACE'}</div><div class="page-head"><div><h1>${db.view==='dashboard'?esc(p.name):titles[db.view]}</h1><p class="subtitle">${db.view==='dashboard'?esc(p.description||'Plan work, align your team, and deliver with confidence.'):`${esc(p.name)} · ${esc(p.course||'University project')}`}</p><div class="meta-line"><span class="chip purple">${esc(p.type)}</span><span class="chip gray">◷ ${fmt(p.deadline)} deadline</span><span class="chip gray">♙ ${p.members.length} team members</span><button class="muted-button" onclick="openProjectModal(true)">Edit project</button></div></div><div class="avatar-set">${p.members.slice(0,5).map(m=>`<div class="initial" title="${esc(m.name)}">${esc(initials(m.name))}</div>`).join('')}</div></div>`;let body={dashboard:renderDashboard,board:renderBoard,timeline:renderTimeline,team:renderTeam,insights:renderInsights,activity:renderActivity}[db.view]();$('screen').innerHTML=head+body;}
function renderDashboard(){let tt=tasks(),n=tt.length,done=tt.filter(t=>t.status==='Done').length,late=tt.filter(isLate),soon=tt.filter(t=>t.status!=='Done'&&days(t.due)>=0&&days(t.due)<=7),p=project();let kpis=[['Completion',`${progress(tt)}%`,`${done} of ${n} tasks completed`,'↗'],['Due this week',soon.length,'Active tasks within 7 days','◷'],['In progress',tt.filter(t=>t.status==='In progress').length,'Tasks being worked on','▤'],['At risk',late.length+soon.filter(t=>t.status==='To do'&&days(t.due)<=2).length,'Overdue or unstarted & urgent','!']];return `<div class="kpi-grid">${kpis.map(([l,n,s,i])=>`<div class="kpi"><div class="kpi-label">${l}<span class="tiny-icon">${i}</span></div><div class="kpi-number">${n}</div><div class="kpi-sub">${s}</div></div>`).join('')}</div><div class="grid-2"><div class="stack"><section class="panel"><div class="panel-head"><h2>Project health</h2><span class="chip ${late.length?'amber':'green'}">${late.length?'Needs attention':'On track'}</span></div><div class="row-between"><div><div style="font-size:31px;font-weight:790;letter-spacing:-1.2px">${progress(tt)}% <span style="font-size:13px;font-weight:500;color:#93a0b2">complete</span></div><div class="textmuted" style="font-size:12px">${n-done} open tasks across ${p.members.length} members</div></div><span class="chip purple">${Math.max(0,days(p.deadline))} days left</span></div><div class="progress-track" style="margin:18px 0 11px"><div class="progress-fill" style="width:${progress(tt)}%"></div></div><div style="display:flex;justify-content:space-between;color:#8793a9;font-size:11px"><span>${done} finished</span><span>${n-done} remaining</span></div></section><section class="panel"><div class="panel-head"><h2>Priority queue</h2><button class="muted-button" onclick="setView('board')">View board →</button></div>${tt.filter(t=>t.status!=='Done').sort((a,b)=>(days(a.due)??9999)-(days(b.due)??9999)).slice(0,5).map(t=>`<div class="line-item" onclick="openTaskModal('${esc(t.id)}')" style function workloadRows(p,tt){let max=Math.max(1,...p.members.map(m=>tt.filter(t=>t.owner===m.id&&t.status!=='Done').length));return p.members.map(m=>{let count=tt.filter(t=>t.owner===m.id&&t.status!=='Done').length;return `<div class="workload-row"><div class="initial">${esc(initials(m.name))}</div><div class="workload-main"><div class="workload-title"><span>${esc(m.name)}</span><small>${count} active</small></div><div class="progress-track"><div class="progress-fill" style="width:${count/max*100}%"></div></div></div></div>`}).join('')||'<div class="empty">No team members yet.</div>'}

function boardColumns(tt){return `<div class="board">${statuses.map((s,i)=>{let subset=tt.filter(t=>t.status===s);return `<div class="board-column" data-status="${s}" ondragover="event.preventDefault();this.classList.add('drop-hover')" ondragleave="this.classList.remove('drop-hover')" ondrop="dropCard(event,'${s}');this.classList.remove('drop-hover')"><div class="col-head"><span><span style="color:${colors[i]};font-size:15px">●</span> &nbsp;${s}</span><span class="count">${subset.length}</span></div>${subset.map(t=>`<article class="task-card ${isLate(t)?'late':''}" tabindex="0" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${esc(t.id)}')" onclick="openTaskModal('${esc(t.id)}')" onkeydown="if(event.key==='Enter')openTaskModal('${esc(t.id)}')"><div class="row-between"><span class="chip ${t.priority==='High'?'red':t.priority==='Low'?'gray':'purple'}">${esc(t.priority)}</span><span style="font-size:11px;color:#9aa5b5">${esc(t.category||'Task')}</span></div><div class="task-title">${esc(t.title)}</div>${blockedBy(t)?`<div class="chip amber" style="margin:5px 0">Blocked by: ${esc(blockedBy(t).title)}</div>`:''}<p>${esc(t.description||'Click to add task details.')}</p><div class="task-meta"><span class="${isLate(t)?'date-bad':''}">◷ ${fmt(t.due)} ${isLate(t)?'· Overdue':''}</span><div class="initial" title="${esc(member(t.owner)?.name||'Unassigned')}">${esc(initials(member(t.owner)?.name||'?'))}</div></div></article>`).join('')||`<div class="empty">Drop a task here</div>`}</div>`}).join('')}</div>`}

function renderInsights(){let p=project(),tt=tasks(),late=tt.filter(isLate),soon=tt.filter(t=>t.status!=='Done'&&days(t.due)>=0&&days(t.due)<=3),none=tt.filter(t=>!t.owner&&t.status!=='Done');let counts=statuses.map(s=>tt.filter(t=>t.status===s).length);let actions=[];if(late.length)actions.push(`${late.length} overdue task(s) need new owners or recovery plans.`);if(soon.length)actions.push(`${soon.length} task(s) are due within 72 hours.`);if(none.length)actions.push(`${none.length} open task(s) still need an owner.`);let blocked=tt.filter(t=>t.status!=='Done'&&blockedBy(t));if(blocked.length)actions.push(`${blocked.length} task(s) are waiting on unfinished prerequisite work.`);if(!actions.length)actions.push('No immediate deadline flags. Review milestones and stay on schedule.');return `<div class="info-strip">Insights are calculated from task status, ownership and dates. This is rule-based analysis, not a connected AI service.</div><div class="grid-2"><div class="stack"><section class="panel"><div class="panel-head"><h2>Workflow balance</h2><span class="chip green">${progress(tt)}% delivered</span></div><div class="stat-list">${statuses.map((s,i)=>`<div><div class="stat-top"><span>${s}</span><span>${counts[i]} tasks · ${tt.length?Math.round(counts[i]/tt.length*100):0}%</span></div><div class="bar-row"><span style="width:${tt.length?counts[i]/tt.length*100:0}%;background:${colors[i]}"></span></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>Project risks & next actions</h2></div>${actions.map(a=>`<div class="line-item"><span class="chip amber">!</span><strong style="flex:1;font-weight:600">${esc(a)}</strong></div>`).join('')}<button class="btn" style="margin-top:15px" onclick="setView('board')">Open board</button></section></div><div class="stack"><section class="panel"><div class="panel-head"><h2>Ownership coverage</h2></div><div class="kpi-number">${tt.length?Math.round(100*tt.filter(t=>t.owner).length/tt.length):0}%</div><div class="textmuted" style="font-size:12px">Tasks with a clearly assigned owner</div><div class="progress-track" style="margin-top:17px"><div class="progress-fill" style="width:${tt.length?100*tt.filter(t=>t.owner).length/tt.length:0}%"></div></div></section><section class="panel"><div class="panel-head"><h2>Delivery checklist</h2></div>${[['Set project deadline',!!p.deadline],['Invite / define members',p.members.length>0],['Assign owners',none.length===0],['Define milestones',p.milestones.length>0],['Complete all tasks',tt.length>0&&progress(tt)===100]].map(([s,ok])=>`<div class="line-item"><span class="chip ${ok?'green':'amber'}">${ok?'✓':'○'}</span><strong style="flex:1">${s}</strong></div>`).join('')}</section></div></div>`}
function openModal(title,eyebrow,html,onSubmit,deleteVisible=false){$('modalTitle').textContent=title;$('modalEyebrow').textContent=eyebrow;$('modalBody').innerHTML=html;$('deleteBtn').style.display=deleteVisible?'':'none';$('modalForm').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target))};$('modalWrap').classList.add('show');setTimeout(()=>$('modalBody').querySelector('input,select,textarea')?.focus(),30)}function closeModal(){$('modalWrap').classList.remove('show')}

m.get('title')||'').trim();if(!title)return;let obj=id?db.tasks.find(x=>x.id===id):{id:uid(),project:db.active};let dep=String(form.get('dependsOn')||'');let status=String(form.get('status'));if(dep&&(dep===obj.id||createsCycle(obj.id,dep))){alert('This prerequisite would create a circular dependency.');return}if(dep&&status==='Done'&&db.tasks.some(x=>x.id===dep&&x.status!=='Done')){alert('Complete the prerequisite before marking this task Done.');return}let before=id?JSON.stringify(obj):'';Object.assign(obj,{title,description:String(form.get('description')||''),owner:String(form.get('owner')||''),due:String(form.get('due')||''),status,priority:String(form.get('priority')),category:String(form.get('category')||'Task'),dependsOn:dep});if(!id)db.tasks.push(obj);if(!id||before!==JSON.stringify(obj))recordEvent('task',`${id?'Updated':'Created'} “${title}”`);save();closeModal();render();toast(id?'Task updated':'Task created')},!!id)}
function deleteTask(){if(!editingTaskId||!confirm('Delete this task from the demo?'))return;let t=db.tasks.find(x=>x.id===editingTaskId);recordEvent('task',`Deleted “${t?.title||'task'}”`);db.tasks=db.tasks.filter(x=>x.id!==editingTaskId);db.tasks.forEach(x=>{if(x.dependsOn===editingTaskId)x.dependsOn='' });save();closeModal();render();toast('Task deleted')}
const templates={'Presentation':['Define topic and grading criteria','Research target audience and evidence','Develop core argument and storyline','Build presentation deck','Peer review and refine content','Rehearse and submit'], 'Research Report':['Confirm research question and rubric','Collect sources and build evidence log','Analyze evidence and develop findings','Draft report sections','Check citations and peer review','Finalize formatting and submit'],'Case Study':['Clarify business problem and evaluation criteria','Analyze context and alternatives','Develop quantitative or qualitative model','Evaluate options and recommendation','Draft executive presentation','Quality review and deliver'], 'Software Prototype':['Define scope and user stories','Sketch user flow and screen designs','Implement core features','Test critical user journeys','Prepare demo and documentation','Present and submit']};
let editingProject=false;function openProjectModal(edit=false){editingProject=edit;let p=edit?project():{name:'',course:'',description:'',deadline:future(30),type:'Presentation',members:[]};let html=`<div class="form-grid"><div class="form-group full"><label>Project name</label><input name="name" class="field" value="${esc(p.name)}" placeholder="e.g. Marketing Research Project" required maxlength="100"></div><div class="form-group"><label>Course / organization</label><input class="field" name="course" value="${esc(p.course||'')}" placeholder="e.g. IIMT2601"></div><div class="form-group"><label>Project format</label><select name="type" class="field">${Object.keys(templates).map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Final deadline</label><input type="date" class="field" name="deadline" value="${esc(p.deadline||'')}" required></div><div class="form-group"><label>Team members (one per line)</label><textarea class="field" name="members" placeholder="Sam Yu\nAlex Chen">${esc(p.members.map(m=>m.name).join('\n'))}</textarea></div><div class="form-group full"><label>Project goal</label><textarea class="field" name="description" placeholder="One sentence describing the deliverable">${esc(p.description||'')}</textarea></div>${edit?'':`<div class="form-group full"><label><input type="checkbox" checked name="generate"> Generate 6 starter tasks + 3 milestones from the project template</label></div>`}</div>`;openModal(edit?'Edit project':'New group project',edit?'PROJECT SETTINGS':'GET STARTED',html,form=>{let name=String(form.get('name')||'').trim();if(!name)return;let names=String(form.get('members')||'').split(/\n|,/).map(s=>s.trim()).filter(Boolean).slice(0,40);let oldMembers=edit?p.members:[];let members=names.map(n=>oldMembers.find(x=>x.name.toLowerCase()===n.toLowerCase())||{id:uid(),name:n,role:'Member'});let id=edit?p.id:uid();let np={id,name,course:String(form.get('course')||''),type:String(form.get('type')||'Presentation'),deadline:String(form.get('deadline')||''),description:String(form.get('description')||''),members,milestones:edit?p.milestones:[]};if(edit){db.projects=db.projects.map(x=>x.id===id?np:x)}else{db.projects.push(np);db.active=id;db.view='dashboard';if(form.get('generate'))generateTemplate(np)}recordEvent('project',`${edit?'Updated':'Created'} project “${name}”`,id);save();closeModal();render();toast(edit?'Project updated':'Workspace created')})}
function generateTemplate(p){let base=templates[p.type]||templates.Presentation;let end=new Date((p.deadline||future(30))+'T12:00:00'),start=new Date();start.setHours(12,0,0,0);let duration=Math.max(6,Math.round((end-start)/86400000));base.forEach((title,i)=>{let d=new Date(start);d.setDate(d.getDate()+Math.round(duration*(i+1)/(base.length+1)));db.tasks.push({id:uid(),project:p.id,title,description:'Customize scope and acceptance criteria with your team.',status:'To do',priority:i===base.length-1?'High':'Medium',owner:p.members.length?p.members[i%p.members.length].id:'',due:localISO(d),category:['Planning','Research','Analysis','Production','Review','Delivery'][i]})});p.milestones=[{id:uid(),name:'Research & planning complete',date:db.tasks.filter(t=>t.project===p.id)[1]?.due||p.deadline,done:false},{id:uid(),name:'Draft deliverable ready',date:db.tasks.filter(t=>t.project===p.id)[3]?.due||p.deadline,done:false},{id:uid(),name:'Final submission',date:p.deadline,done:false}]}
let editingMilestone=null;function openMilestoneModal(id){editingMilestone=id||null;let m=id?project().milestones.find(x=>x.id===id):{name:'',date:project().deadline,done:false};if(!m)return;openModal(id?'Edit milestone':'New milestone','DELIVERY CHECKPOINT',`<div class="form-grid"><div class="form-group full"><label>Milestone name</label><input name="name" class="field" value="${esc(m.name)}" required></div><div class="form-group full"><label>Target date</label><input name="date" class="field" type="date" value="${esc(m.date)}" required></div></div>`,form=>{let mm=id?project().milestones.find(x=>x.id===id):{id:uid(),done:false};mm.name=String(form.get('name')||'').trim();mm.date=String(form.get('date')||'');if(!id)project().milestones.push(mm);recordEvent('milestone',`${id?'Updated':'Created'} milestone “${mm.name}”`);save();closeModal();render();toast('Milestone saved')})}
function exportData(){let out={...db,exportedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GroupPilot-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Workspace JSON exported')}
function importData(ev){let file=ev.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.projects)||!Array.isArray(data.tasks)||data.projects.length>500||data.tasks.length>30000)throw new Error('Invalid workspace');const safeId=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(x);if(!data.projects.every(p=>safeId(p.id)&&Array.isArray(p.members)&&Array.isArray(p.milestones)&&p.members.every(m=>safeId(m.id))&&p.milestones.every(m=>safeId(m.id)))||!data.tasks.every(t=>safeId(t.id)&&safeId(t.project)&&statuses.includes(t.status)))throw new Error('Invalid project/task identifiers');if(!confirm('Replace your current workspace with this backup?'))return;db={version:2,projects:data.projects,tasks:data.tasks,activity:Array.isArray(data.activity)?data.activity.slice(-600):[],active:data.projects[0]?.id,view:'dashboard'};save();render();toast('Workspace restored')}catch(e){alert('Import failed: '+e.message)}finally{ev.target.value=''}};reader.readAsText(file)}
function resetDemo(){if(!confirm('Replace the current data with the example projects? Export a backup first if needed.'))return;db=seed();boardSearch='';boardOwner='all';save();render();toast('Demo reset')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if($('modalWrap').classList.contains('show'))return;if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key.toLowerCase()==='n'){e.preventDefault();openTaskModal()}if(e.key==='/'){e.preventDefault();setView('board');$('boardSearch')?.focus()}});render();
</script></body></html>
